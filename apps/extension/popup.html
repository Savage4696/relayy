<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RELAY Work Context</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background-color: #0b0f17;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #1e293b;
      }
      .brand {
        font-weight: 800;
        font-size: 14px;
        color: #38bdf8;
        letter-spacing: 0.05em;
      }
      .status {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 12px;
        background-color: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .card {
        background-color: rgba(30, 41, 59, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .section-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 4px;
      }
      .task-title {
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 6px;
        line-height: 1.3;
      }
      .match-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 10px;
        background-color: rgba(6, 182, 212, 0.2);
        color: #38bdf8;
        border: 1px solid rgba(6, 182, 212, 0.4);
        margin-bottom: 10px;
      }
      .page-title {
        font-size: 12px;
        font-weight: 600;
        color: #e2e8f0;
        margin-bottom: 4px;
      }
      .page-desc {
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      .btn {
        width: 100%;
        padding: 9px;
        border-radius: 8px;
        background: linear-gradient(135deg, #0891b2, #2563eb);
        border: none;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
        box-sizing: border-box;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">RELAY ACTIVE WORK</div>
      <div className="status" id="status-tag">Connected</div>
    </div>

    <div className="card">
      <div className="section-label">Current Task</div>
      <div className="task-title" id="task-title">Loading active task...</div>
      <div className="match-badge" id="match-badge">Context match: --%</div>

      <div className="section-label" style="margin-top: 8px;">Active Page</div>
      <div className="page-title" id="page-title">Detecting browser tab...</div>
      <div className="page-desc">This page may contain information relevant to your active investigation.</div>

      <button className="btn" id="add-evidence-btn">[ Add to investigation ]</button>
    </div>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
